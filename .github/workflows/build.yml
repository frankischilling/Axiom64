name: Measure concurrent native ICMP decisions
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ipv6-device-ready-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile the isolated first-error comparison
        run: |
          mkdir -p build
          mkdir build/icmp-first-errors
          gcc --version > build/icmp-first-errors/compiler.txt
          uname -a > build/icmp-first-errors/kernel.txt
          gcc -std=gnu11 -O2 -g -Wall -Wextra -Werror -pthread scripts/diagnostics/icmp_first_errors.c -o build/icmp-first-errors/client
          sha256sum scripts/diagnostics/icmp_first_errors.c build/icmp-first-errors/client > build/icmp-first-errors/inputs.sha256
      - name: Compare 256 fixed staggered, aligned and primed-aligned pairs
        run: |
          test "$(uname -r)" = 6.17.0-1022-azure
          sudo -n timeout 180 build/icmp-first-errors/client 256 > build/icmp-first-errors/results.jsonl
      - name: Preserve every actual frame, counter and trial
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ipv4-first-errors-diagnostic
          if-no-files-found: error
          path: |
            build/icmp-first-errors
            scripts/diagnostics/icmp_first_errors.c
            .github/workflows/build.yml
