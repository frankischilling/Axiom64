Section "Files"
    FontPath "/usr/share/fonts/misc"
EndSection

Section "Device"
    Identifier "AxiomFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "AxiomMonitor"
EndSection

Section "Screen"
    Identifier "AxiomScreen"
    Device "AxiomFramebuffer"
    Monitor "AxiomMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection
