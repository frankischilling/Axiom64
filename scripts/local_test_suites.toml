run = '''
python3 scripts/random_test.py --reseed --timeout 150
'''

[[step]]
suites = ["random"]
name = "Test saved manager hints across independent ext2-root kernel boots"
run = '''
python3 scripts/manager_reboot_test.py
'''

[[step]]
suites = ["manager-bios-modern"]
name = "Test peer release validation across process and lease lifetimes"
run = '''
python3 scripts/manager_peer_test.py
'''

[[step]]
suites = ["manager-bios-modern", "manager-bios-legacy", "manager-uefi-modern", "manager-uefi-legacy"]
name = "Test actual concurrent manager processes, wire exchanges, and publication/teardown failures"
run = '''
case "$SUITE" in
  manager-bios-modern) firmware=bios; transport=modern ;;
  manager-bios-legacy) firmware=bios; transport=legacy ;;
  manager-uefi-modern) firmware=uefi; transport=modern ;;
  manager-uefi-legacy) firmware=uefi; transport=legacy ;;
  *) exit 2 ;;
esac
python3 scripts/manager_test.py --firmware "$firmware" --transport "$transport"
'''

[[step]]
suites = ["protocol-bios-modern-lane0", "protocol-bios-modern-lane1", "protocol-bios-legacy-lane0", "protocol-bios-legacy-lane1", "protocol-uefi-modern-lane0", "protocol-uefi-modern-lane1", "protocol-uefi-legacy-lane0", "protocol-uefi-legacy-lane1"]
name = "Test protocol peer packet shapes and serial controller barriers"
run = '''
python3 scripts/manager_protocol_peer_test.py 2>&1 | tee build/manager-protocol-peer.log
'''

[[step]]
suites = ["protocol-bios-modern-lane0", "protocol-bios-modern-lane1", "protocol-bios-legacy-lane0", "protocol-bios-legacy-lane1", "protocol-uefi-modern-lane0", "protocol-uefi-modern-lane1", "protocol-uefi-legacy-lane0", "protocol-uefi-legacy-lane1"]
name = "Test actual manager DHCP rejection, lease lifetimes, and conflict recovery"
run = '''
python3 scripts/ci/paired_network.py --suite "$SUITE" \
  --archive "$RUNNER_TEMP/ci-inputs/ci-inputs.tar.gz" --temporary-parent "$RUNNER_TEMP"
'''

[[step]]
suites = ["link-bios-modern-lane0", "link-bios-modern-lane1", "link-bios-legacy-lane0", "link-bios-legacy-lane1", "link-uefi-modern-lane0", "link-uefi-modern-lane1", "link-uefi-legacy-lane0", "link-uefi-legacy-lane1"]
name = "Test carrier peer packets, physical removal, and observation barriers"
run = '''
set -o pipefail
python3 scripts/manager_link_peer_test.py 2>&1 | tee build/manager-link-peer.log
'''

[[step]]
suites = ["link-bios-modern-lane0", "link-bios-modern-lane1", "link-bios-legacy-lane0", "link-bios-legacy-lane1", "link-uefi-modern-lane0", "link-uefi-modern-lane1", "link-uefi-legacy-lane0", "link-uefi-legacy-lane1"]
name = "Test actual manager carrier transitions and failed-device cleanup"
run = '''
python3 scripts/ci/paired_network.py --suite "$SUITE" \
  --archive "$RUNNER_TEMP/ci-inputs/ci-inputs.tar.gz" --temporary-parent "$RUNNER_TEMP"
'''

[[step]]
suites = ["configuration"]
name = "Test counter scaling and ACPI discovery with sanitizers"
run = '''
make test-clock-codec 2>&1 | tee build/clock-codec.log
'''

[[step]]
suites = ["configuration"]
name = "Test elapsed clocks and deadlines across delayed storage"
run = '''
make test-clock
'''

[[step]]
suites = ["configuration"]
name = "Compare Linux file locks and test RAM/ext2 description lifetime"
run = '''
make test-file-locks
'''

[[step]]
suites = ["configuration"]
name = "Compare Linux path descriptors and test RAM/ext2 lifetime and access"
run = '''
python3 scripts/tests/path_descriptor_cancellation_test.py -v
python3 scripts/tests/path_descriptor_storage_test.py
sudo -n python3 scripts/path_descriptor_test.py --native --directory build/path-descriptors-native --fixtures "$AXIOM64_NATIVE_FIXTURES/path-descriptors"
sudo -n python3 scripts/path_descriptor_test.py --directory build/path-descriptors-guest
'''

[[step]]
suites = ["configuration"]
name = "Compare Linux inotify and test guest RAM and ext2 event lifetimes"
run = '''
make test-inotify-queue
sudo -n make test-inotify-native
make test-inotify
'''

[[step]]
suites = ["storage"]
name = "Test virtio disks and reboot persistence"
run = '''
python3 scripts/storage_test.py
'''

[[step]]
suites = ["storage"]
name = "Test writable ext2 volumes and host fsck"
run = '''
python3 scripts/ext2_test.py
'''

[[step]]
suites = ["storage"]
name = "Test whole-volume observation and checked deleted-inode recovery"
run = '''
python3 scripts/tests/ext2_inspection_test.py
python3 scripts/tests/ext2_recovery_inspection_test.py
python3 scripts/tests/ext2_named_retirement_inspection_test.py
python3 scripts/tests/ext2_directory_retirement_inspection_test.py
python3 scripts/ext2_deleted_inode_test.py --directory build/ext2-deleted-recovery
'''

[[step]]
suites = ["storage-journal"]
name = "Test native journal crash recovery and Linux format interoperability"
run = '''
make test-ext2-journal-native
'''

[[step]]
suites = ["storage-journal"]
name = "Recover committed journals and verify guest persistence across all profiles"
run = '''
make test-ext2-journal
python3 scripts/ext2_journal_rejection_test.py
'''

[[step]]
suites = ["storage-journal-lifetime-bios-modern", "storage-journal-lifetime-bios-legacy", "storage-journal-lifetime-uefi-modern", "storage-journal-lifetime-uefi-legacy"]
name = "Recover open descriptions after VM interruption and reject damaged metadata"
run = '''
python3 scripts/tests/journal_lifetime_boundary_test.py
case "$SUITE" in storage-journal-lifetime-bios-modern|storage-journal-lifetime-bios-legacy|storage-journal-lifetime-uefi-modern|storage-journal-lifetime-uefi-legacy) ;; *) exit 1 ;; esac
configuration=${SUITE#storage-journal-lifetime-}
firmware=${configuration%-*}
transport=${configuration#*-}
python3 scripts/ext2_journal_lifetime_test.py --firmware "$firmware" --transport "$transport" --directory "build/${SUITE}"
'''

[[step]]
suites = ["root"]
name = "Test ext2 root, data mounts, rejection, and reboot persistence"
run = '''
make test-disk-root
'''

[[step]]
suites = ["root", "root-userspace"]
name = "Build reproducible full ext2 root"
run = '''
make disk-root
'''

[[step]]
suites = ["root"]
name = "Test delayed root flushes and bounded request timeout"
run = '''
python3 scripts/root_io_test.py
python3 scripts/root_io_test.py --firmware bios --transport modern --delay 35 --expect-timeout
'''

[[step]]
suites = ["root-userspace"]
name = "Test full userspace from ext2 root"
run = '''
python3 scripts/boot_test.py --disk-root --transport modern --firmware both --timeout 900
python3 scripts/boot_test.py --disk-root --transport legacy --firmware both --timeout 900
'''

[[step]]
suites = ["root-userspace"]
name = "Test normal desktop startup from ext2 root"
run = '''
python3 scripts/boot_test.py --disk-root --interactive --transport modern --firmware both --timeout 180
python3 scripts/boot_test.py --disk-root --interactive --transport legacy --firmware both --timeout 180
'''

[[step]]
suites = ["normal-init-bios", "normal-init-uefi"]
name = "Verify normal init recovery with the same desktop and console"
run = '''
firmware=${SUITE#normal-init-}
case "$firmware" in bios|uefi) ;; *) exit 1 ;; esac
python3 scripts/tests/normal_manager_records_test.py
python3 scripts/normal_manager_peer_test.py 2>&1 | tee build/normal-init-peer.log
mkdir -p build/ci-normal-workers
python3 scripts/ci/paired_network.py --suite "$SUITE" \
  --archive "$RUNNER_TEMP/ci-inputs/ci-inputs.tar.gz" \
  --temporary-parent "$PWD/build/ci-normal-workers"
'''

[[step]]
suites = ["account-storage-clean"]
name = "Run actual administration, concurrent commands and fresh-kernel checks"
run = '''
cell="$PROVIDER-$LINKAGE-$FIRMWARE-$TRANSPORT"
sudo -n python3 scripts/account_management_ext2.py --journal --campaign clean --provider "$PROVIDER" --linkage "$LINKAGE" --firmware "$FIRMWARE" --transport "$TRANSPORT" --directory "build/account-management-clean-$cell"
sudo -n python3 scripts/account_management_ext2.py --journal --campaign storage --provider "$PROVIDER" --linkage "$LINKAGE" --firmware "$FIRMWARE" --transport "$TRANSPORT" --directory "build/account-management-storage-$cell"
sudo -n python3 scripts/account_management_storage_coverage.py collect-clean --clean-directory "build/account-management-clean-$cell" --storage-directory "build/account-management-storage-$cell" --output "build/account-management-clean-index-$cell/coverage-index.json"
'''

[[step]]
suites = ["account-storage-clean"]
name = "Give the runner ownership of completed administration evidence"
after_failure = true
run = '''
cell="$PROVIDER-$LINKAGE-$FIRMWARE-$TRANSPORT"
if ((EUID != 0)); then
    sudo -n bash scripts/ci/storage_evidence.sh "$(id -u)" "$(id -g)" "build/account-management-clean-$cell" "build/account-management-storage-$cell" "build/account-management-clean-index-$cell"
fi
'''

[[step]]
suites = ["account-storage-fault"]
name = "Interrupt every observed actual administration request and boot normal recovery"
run = '''
cell="$PROVIDER-$LINKAGE-$FIRMWARE-$TRANSPORT-$CACHE"
sudo -n python3 scripts/account_management_ext2.py --journal --campaign fault --provider "$PROVIDER" --linkage "$LINKAGE" --firmware "$FIRMWARE" --transport "$TRANSPORT" --cache-model "$CACHE" --fault-modes eio,pause-before,pause-after --directory "build/account-management-fault-$cell"
sudo -n python3 scripts/account_management_storage_coverage.py collect-fault --directory "build/account-management-fault-$cell" --output "build/account-management-fault-index-$cell/coverage-index.json"
'''

[[step]]
suites = ["account-storage-fault"]
name = "Give the runner ownership of completed administration fault evidence"
after_failure = true
run = '''
cell="$PROVIDER-$LINKAGE-$FIRMWARE-$TRANSPORT-$CACHE"
if ((EUID != 0)); then
    sudo -n bash scripts/ci/storage_evidence.sh "$(id -u)" "$(id -g)" "build/account-management-fault-$cell" "build/account-management-fault-index-$cell"
fi
'''

[[step]]
suites = ["account-rotation-storage"]
name = "Interrupt every basic rotation target in all fault modes"
run = '''
cell="$PROVIDER-$LINKAGE-$FIRMWARE-$TRANSPORT-basic-$CACHE-$SHARD"
sudo -n python3 scripts/account_logbook_rotation_ext2.py --journal --provider "$PROVIDER" --linkage "$LINKAGE" --firmware "$FIRMWARE" --transport "$TRANSPORT" --scenario "basic" --cache-model "$CACHE" --fault-mode eio pause-before pause-after --shard-count "$SHARD_COUNT" --shard-index "$SHARD" --directory "build/account-rotation-storage-$cell"
sudo -n python3 scripts/account_rotation_storage_coverage.py collect --directory "build/account-rotation-storage-$cell" --output "build/account-rotation-storage-$cell/coverage-index.json"
'''

[[step]]
suites = ["account-rotation-storage"]
name = "Interrupt every expiry rotation target in all fault modes"
after_failure = true
run = '''
cell="$PROVIDER-$LINKAGE-$FIRMWARE-$TRANSPORT-expiry-$CACHE-$SHARD"
sudo -n python3 scripts/account_logbook_rotation_ext2.py --journal --provider "$PROVIDER" --linkage "$LINKAGE" --firmware "$FIRMWARE" --transport "$TRANSPORT" --scenario "expiry" --cache-model "$CACHE" --fault-mode eio pause-before pause-after --shard-count "$SHARD_COUNT" --shard-index "$SHARD" --directory "build/account-rotation-storage-$cell"
sudo -n python3 scripts/account_rotation_storage_coverage.py collect --directory "build/account-rotation-storage-$cell" --output "build/account-rotation-storage-$cell/coverage-index.json"
'''

[[step]]
suites = ["account-rotation-storage"]
name = "Give the runner ownership of completed rotation evidence"
after_failure = true
run = '''
cell="$PROVIDER-$LINKAGE-$FIRMWARE-$TRANSPORT"
if ((EUID != 0)); then
    sudo -n bash scripts/ci/storage_evidence.sh "$(id -u)" "$(id -g)" "build/account-rotation-storage-$cell-basic-$CACHE-$SHARD" "build/account-rotation-storage-$cell-expiry-$CACHE-$SHARD"
fi
'''

[[step]]
suites = ["account-storage-coverage"]
name = "Read all locally retained storage coverage indexes"
run = '''
set -o pipefail
mkdir -p build/account-storage-coverage
find build -maxdepth 2 -type f -name coverage-index.json -path 'build/account-management-*-index-*/*' -print0 |
    sort -z | tar --null -T - -cf "$RUNNER_TEMP/administration.tar"
find build -maxdepth 2 -type f -name coverage-index.json -path 'build/account-rotation-storage-*/*' -print0 |
    sort -z | tar --null -T - -cf "$RUNNER_TEMP/rotation.tar"
mkdir "$RUNNER_TEMP/administration" "$RUNNER_TEMP/rotation"
tar -xf "$RUNNER_TEMP/administration.tar" -C "$RUNNER_TEMP/administration"
tar -xf "$RUNNER_TEMP/rotation.tar" -C "$RUNNER_TEMP/rotation"
python3 scripts/account_management_storage_coverage.py verify --indices "$RUNNER_TEMP/administration" --output build/account-storage-coverage/administration.json
python3 scripts/account_rotation_storage_coverage.py verify --indices "$RUNNER_TEMP/rotation" --output build/account-storage-coverage/rotation.json
'''
