[[step]]
suites = ["ipv6-expiry"]
name = "Test delayed IPv6 datagrams and isolated expiry campaign control"
run = '''
python3 scripts/tests/ipv6_expiry_peer_test.py
python3 scripts/tests/ipv6_expiry_neighbor_test.py -v
python3 scripts/tests/ipv6_expiry_controller_test.py -v
'''

[[step]]
suites = ["ipv6-expiry"]
name = "Observe real ten-minute IPv6 path MTU expiry in all eleven profiles"
run = '''
sudo -n python3 scripts/ipv6_expiry_test.py
'''

[[step]]
suites = ["ipv6-expiry"]
name = "Give the runner ownership of IPv6 expiry evidence"
after_failure = true
run = '''
if test -d build/ipv6-expiry; then
  sudo -n chown -R "$(id -u):$(id -g)" build/ipv6-expiry
fi
'''

