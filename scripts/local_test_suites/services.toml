suites = ["accounts-native-auth"]
name = "Compare account management, password hashing and authentication with native Linux"
run = '''
python3 scripts/password_library_test.py
sudo -n python3 scripts/account_management_test.py --fixtures "$AXIOM64_NATIVE_FIXTURES/account-management"
sudo -n python3 scripts/account_management_ext2.py --native --directory build/account-management-command-native --fixtures "$AXIOM64_NATIVE_FIXTURES/management-command-native"
sudo -n python3 scripts/account_auth_test.py --native --directory build/account-auth-native --fixtures "$AXIOM64_NATIVE_FIXTURES/account-auth"
sudo -n python3 scripts/account_secret_test.py --native --directory build/account-secret-native
'''

[[step]]
suites = ["accounts-native-session"]
name = "Compare session credentials, leases and login-record projections with native Linux"
run = '''
sudo -n python3 scripts/account_session_test.py --native --directory build/account-session-native --fixtures "$AXIOM64_NATIVE_FIXTURES/account-session"
sudo -n python3 scripts/account_logbook_test.py --native --directory build/account-logbook-native --fixtures "$AXIOM64_NATIVE_FIXTURES/account-logbook"
'''

[[step]]
suites = ["accounts-native-frontends"]
name = "Compare login, su, sudo, passwd and console recovery with native Linux"
run = '''
sudo -n python3 scripts/account_access_test.py --native --directory build/account-access-native --fixtures "$AXIOM64_NATIVE_FIXTURES/account-access"
sudo -n python3 scripts/account_console_test.py --native --directory build/account-console-native --fixtures "$AXIOM64_NATIVE_FIXTURES/account-console"
'''

[[step]]
suites = ["accounts-guest-storage"]
name = "Verify account database publication and updates in fresh guest kernels"
run = '''
python3 scripts/account_store_guest.py
python3 scripts/account_database_test.py
python3 scripts/account_update_test.py
python3 scripts/rename_test.py --directory build/account-rename-guest
python3 scripts/account_home_test.py --directory build/account-home-guest
python3 scripts/account_home_reboot_test.py --directory build/account-home-reboot
python3 scripts/account_transaction_test.py --directory build/account-transaction-guest
python3 scripts/account_transaction_reboot_test.py --directory build/account-transaction-reboot
'''

[[step]]
suites = ["accounts-store-ext2"]
name = "Verify account generation transactions through persistent ext2 reboot pairs"
run = '''
python3 scripts/account_store_ext2.py
'''

[[step]]
suites = ["accounts-guest-auth"]
name = "Verify password hashing, account management and authentication in fresh guest kernels"
run = '''
python3 scripts/password_library_guest.py
python3 scripts/account_management_guest.py
python3 scripts/account_auth_test.py
python3 scripts/account_secret_test.py
'''

[[step]]
suites = ["accounts-guest-session"]
name = "Verify session credentials, leases and GNU login-record interoperability in fresh guest kernels"
run = '''
python3 scripts/account_session_test.py
python3 scripts/account_logbook_test.py
'''

[[step]]
suites = ["accounts-guest-frontends"]
name = "Verify login aliases, elevation and console recovery in fresh guest kernels"
run = '''
python3 scripts/account_access_test.py
python3 scripts/account_console_test.py
'''

[[step]]
suites = ["accounts-process-native"]
name = "Compare terminal ownership, parent death, signal waits, waitid, procfs and exec with native Linux"
run = '''
sudo -n make test-pty-security-native test-parent-death-native test-signal-wait-native
sudo -n make test-waitid-native test-proc-identity-native test-exec-arguments-native
make test-sysinfo-native test-membarrier-native
sudo -n python3 scripts/proc_retirement_test.py
sudo -n python3 scripts/proc_test.py --native --directory build/proc-native
sudo -n python3 scripts/terminal_flush_test.py --native --directory build/terminal-flush-native
sudo -n python3 scripts/terminal_flush_test.py --native --sanitize --directory build/terminal-flush-sanitize
'''

[[step]]
suites = ["accounts-process-guest"]
name = "Verify terminal ownership, parent death, signal waits, waitid, procfs and exec in fresh guest kernels"
run = '''
make test-pty-security test-parent-death test-signal-wait
make test-waitid test-proc-identity test-exec-arguments test-sysinfo test-membarrier
python3 scripts/proc_test.py
python3 scripts/terminal_flush_test.py
'''

[[step]]
suites = ["accounts-record-native"]
name = "Compare POSIX and OFD record locks with actual native process lifetimes"
run = '''
sudo -n python3 scripts/record_lock_test.py --native --directory build/record-locks-native --fixtures "$AXIOM64_NATIVE_FIXTURES/record-locks"
sudo -n make test-record-lock-lifecycle-native
'''

[[step]]
suites = ["accounts-record-bios-modern", "accounts-record-bios-legacy", "accounts-record-uefi-modern", "accounts-record-uefi-legacy"]
name = "Verify POSIX and OFD record-lock lifetime and ext2 reboot persistence"
run = '''
case "$SUITE" in
  accounts-record-bios-modern) firmware=bios; transport=modern ;;
  accounts-record-bios-legacy) firmware=bios; transport=legacy ;;
  accounts-record-uefi-modern) firmware=uefi; transport=modern ;;
  accounts-record-uefi-legacy) firmware=uefi; transport=legacy ;;
  *) exit 2 ;;
esac
python3 scripts/record_lock_lifecycle_test.py --directory build/record-lock-lifecycle --firmware "$firmware" --transport "$transport"
'''

[[step]]
suites = ["accounts-record-bios-modern"]
name = "Preserve the original complete record-lock regression matrix"
run = '''
python3 scripts/record_lock_test.py --directory build/record-locks
'''

[[step]]
suites = ["accounts-rotation-native"]
name = "Verify native journal rotation at every publication, short-write and expiry boundary"
run = '''
sudo -n python3 scripts/account_logbook_rotation_test.py --native --directory build/account-rotation-native --fixtures "$AXIOM64_NATIVE_FIXTURES/account-rotation"
sudo -n python3 scripts/account_logbook_rotation_guest.py --native --directory build/account-rotation-observer-native
python3 scripts/tests/account_projection_write_test.py --directory build/account-projection-write
python3 scripts/tests/account_projection_write_test.py --directory build/account-projection-write-sanitize --provider native --linkage dynamic --sanitize
'''

[[step]]
suites = ["accounts-rotation-bios-modern", "accounts-rotation-bios-legacy", "accounts-rotation-uefi-modern", "accounts-rotation-uefi-legacy"]
name = "Verify journal rotation, active sessions, retention and exact disk projections in real guest kernels"
run = '''
case "$SUITE" in
  accounts-rotation-bios-modern) firmware=bios; transport=modern; default= ;;
  accounts-rotation-bios-legacy) firmware=bios; transport=legacy; default=--skip-default ;;
  accounts-rotation-uefi-modern) firmware=uefi; transport=modern; default=--skip-default ;;
  accounts-rotation-uefi-legacy) firmware=uefi; transport=legacy; default=--skip-default ;;
  *) exit 2 ;;
esac
sudo -n python3 scripts/account_logbook_rotation_guest.py --directory build/account-rotation-guest --firmware "$firmware" --transport "$transport" $default
sudo -n python3 scripts/account_logbook_default_ext2.py --directory build/account-rotation-default-ext2 --firmware "$firmware" --transport "$transport"
'''

[[step]]
suites = ["accounts-desktop-bios", "accounts-desktop-uefi"]
name = "Verify authenticated graphical sessions and recovery on RAM and persistent roots"
run = '''
firmware=${SUITE#accounts-desktop-}
case "$firmware" in bios|uefi) ;; *) exit 2 ;; esac
python3 scripts/account_normal_test.py --directory build/account-desktop --graphical --firmware "$firmware"
'''

[[step]]
suites = ["accounts-console-full"]
name = "Verify authenticated full-profile console, persistence and reboot recovery"
run = '''
python3 scripts/account_normal_test.py --directory build/account-normal-full --profile full
'''

[[step]]
suites = ["accounts-vm-state"]
name = "Verify disposable persistent VM setup, concurrent denial and authenticated reboot"
run = '''
python3 scripts/vm_test.py
'''

[[step]]
suites = ["random-devices"]
name = "Compare randomness administration and validate complete entropy-device and memory-restore matrices"
run = '''
mkdir -p build/random-lifecycle
sudo -n python3 scripts/random_administration_test.py --native --output build/random-lifecycle/admin-native
python3 scripts/random_administration_test.py --output build/random-lifecycle/admin-guest
python3 scripts/random_virtio_test.py --output build/random-lifecycle/virtio
python3 scripts/random_virtio_test.py --case trusted --linkage static --reseed --timeout 150 --output build/random-lifecycle/virtio-reseed
python3 scripts/random_snapshot_test.py --output build/random-lifecycle/snapshot
python3 scripts/random_generation_exec_test.py --output build/random-lifecycle/generation-exec
'''

[[step]]
suites = ["random-seeds-native"]
name = "Compare persisted seed ownership and actual ext2 process crashes with three native libc profiles"
run = '''
mkdir -p build/random-lifecycle
sudo -n python3 scripts/random_seed_native.py --output build/random-lifecycle/seed-native
sudo -n unshare --mount --propagation private python3 scripts/random_seed_crash_test.py --native --output build/random-lifecycle/crash-native
'''

[[step]]
suites = ["random-seeds-bios-modern", "random-seeds-bios-legacy", "random-seeds-uefi-modern", "random-seeds-uefi-legacy"]
name = "Verify seed reboot, device errors, full disks, real VM crashes and checked recovery"
run = '''
configuration=${SUITE#random-seeds-}
firmware=${configuration%-*}
transport=${configuration##*-}
case "$configuration" in bios-modern|bios-legacy|uefi-modern|uefi-legacy) ;; *) exit 1 ;; esac
python3 scripts/random_seed_test.py --firmware "$firmware" --transport "$transport" --output build/random-lifecycle/seed
python3 scripts/random_seed_fault_test.py --firmware "$firmware" --transport "$transport" --output build/random-lifecycle/fault
python3 scripts/random_seed_crash_test.py --firmware "$firmware" --transport "$transport" --output build/random-lifecycle/crash
python3 scripts/random_seed_recovery_test.py --firmware "$firmware" --transport "$transport" --output build/random-lifecycle/recovery
'''

[[step]]
suites = ["random-crypto-native"]
name = "Compare actual OpenSSL key, signature, certificate and TLS clients with native Linux"
run = '''
python3 scripts/random_crypto_test.py --native --output build/random-lifecycle/crypto-native
python3 scripts/random_crypto_wait_test.py --native --output build/random-lifecycle/crypto-wait-native
'''

[[step]]
suites = ["random-crypto-bios", "random-crypto-uefi"]
name = "Verify guest TLS, key generation, signatures and actual cryptographic initialization waits"
run = '''
firmware=${SUITE#random-crypto-}
case "$firmware" in bios|uefi) ;; *) exit 1 ;; esac
python3 scripts/tests/random_crypto_wait_observer_test.py
python3 scripts/random_crypto_test.py --firmware "$firmware" --output build/random-lifecycle/crypto
python3 scripts/random_crypto_wait_test.py --firmware "$firmware" --output build/random-lifecycle/crypto-wait
'''

[[step]]
suites = ["random-crypto-prerequisites"]
name = "Compare and verify real UTC clocks and libc interface inventories needed by crypto clients"
run = '''
mkdir -p build/random-lifecycle
sudo -n python3 scripts/netlink_inventory_test.py --native --output build/random-lifecycle/inventory-native
python3 scripts/netlink_inventory_test.py --output build/random-lifecycle/inventory-guest
python3 scripts/clock_wall_test.py --native --output build/random-lifecycle/calendar-native
python3 scripts/clock_wall_test.py --output build/random-lifecycle/calendar-guest
'''

[[step]]
suites = ["random-installed-bios", "random-installed-uefi"]
name = "Verify ordinary init seed supervision, installed crypto tools and fresh disk-root rotation"
run = '''
firmware=${SUITE#random-installed-}
case "$firmware" in bios|uefi) ;; *) exit 1 ;; esac
python3 scripts/tests/fixture_archive_test.py
python3 scripts/random_installed_test.py --firmware "$firmware" --output build/random-lifecycle/installed
'''
