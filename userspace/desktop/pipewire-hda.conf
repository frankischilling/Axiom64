# @file    userspace/desktop/pipewire-hda.conf
# @brief   Route the installed Plasma session to Axiom64's PCM playback device.

context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 1024
}
context.objects = [
    { factory = adapter
      args = {
        factory.name = api.alsa.pcm.sink
        media.class = Audio/Sink
        node.name = axiom64_hda
        node.description = "HD Audio Speakers"
        node.driver = true
        audio.rate = 48000
        audio.format = S16LE
        audio.channels = 2
        audio.position = [ FL FR ]
        api.alsa.path = "hw:0,0"
        api.alsa.disable-mmap = true
        api.alsa.soft-mixer = true
        api.alsa.period-size = 1024
        api.alsa.period-num = 14
        api.alsa.headroom = 3072
      }
    }
]
