[[step]]
suites = ["downloads-native"]
name = "Compare ordinary-user HTTP and authenticated HTTPS downloads with native Linux"
run = '''
sudo -n python3 scripts/http_download_test.py --native --output build/http-downloads
sudo -n python3 scripts/tests/http_host_network_test.py --directory build/http-downloads/host-network-controls
sudo -n python3 scripts/http_download_failure_native_test.py --output build/http-downloads/normal-native
sudo -n python3 scripts/http_download_wget_native_test.py --output build/http-downloads/native-wget
'''

[[step]]
suites = ["downloads-bios-modern", "downloads-bios-legacy", "downloads-uefi-modern", "downloads-uefi-legacy"]
name = "Download real HTTP and authenticated HTTPS fixtures on both guest adapters"
run = '''
firmware="${SUITE#downloads-}"
firmware="${firmware%-*}"
transport="${SUITE##*-}"
python3 scripts/http_download_test.py --firmware "$firmware" --transport "$transport" --output build/http-downloads
'''

[[step]]
suites = ["downloads-bios-modern", "downloads-bios-legacy", "downloads-uefi-modern", "downloads-uefi-legacy"]
name = "Independently read actual download sources, products and complete captures"
run = '''
firmware="${SUITE#downloads-}"
firmware="${firmware%-*}"
transport="${SUITE##*-}"
python3 scripts/http_download_verify.py build/http-downloads --firmware "$firmware" --transport "$transport" --source-root . --negative-controls build/http-download-controls --report build/http-downloads/actual-evidence.json
'''

[[step]]
suites = ["downloads-bios-modern", "downloads-bios-legacy", "downloads-uefi-modern", "downloads-uefi-legacy"]
name = "Verify normal authenticated downloads and persistent reboots"
run = '''
firmware="${SUITE#downloads-}"
firmware="${firmware%-*}"
transport="${SUITE##*-}"
sudo -n python3 scripts/http_download_normal_test.py --firmware "$firmware" --transport "$transport" --output build/http-download-normal
sudo -n python3 scripts/http_download_normal_verify.py build/http-download-normal --firmware "$firmware" --transport "$transport" --source-root . --output build/http-download-normal-audit --negative-controls build/http-download-normal-audit/controls
'''

[[step]]
suites = ["downloads-native", "downloads-bios-modern", "downloads-bios-legacy", "downloads-uefi-modern", "downloads-uefi-legacy"]
name = "Give the runner ownership of completed download evidence"
after_failure = true
run = '''
if ((EUID != 0)); then
    sudo -n bash scripts/ci/storage_evidence.sh "$(id -u)" "$(id -g)" build/http-downloads build/http-download-controls build/http-download-normal build/http-download-normal-audit
fi
'''

[[step]]
suites = ["resource-limits-native"]
name = "Check actual joined-thread quota reclamation on separate native CPUs"
run = '''
sudo -n python3 scripts/tests/resource_thread_retirement_test.py
'''

[[step]]
suites = ["resource-limits-native"]
name = "Compare resource quotas, signals and memory admission with native Linux"
run = '''
sudo -n python3 scripts/resource_limits_test.py --native --retain-host-source --directory build/resource-limits-native
'''

[[step]]
suites = ["resource-limits"]
name = "Verify resource quotas and stack-aware exec across both libc providers and firmware modes"
run = '''
python3 scripts/resource_limits_test.py --directory build/resource-limits-guest
'''

[[step]]
suites = ["resource-limits-storage"]
name = "Verify resource quotas and durable ext2 bytes across both virtio transports"
run = '''
python3 scripts/resource_limits_storage_test.py --directory build/resource-limits-storage
'''

[[step]]
suites = ["accounts-native-storage"]
name = "Compare account database publication and updates with native Linux"
run = '''
sudo -n python3 scripts/account_store_test.py --fixtures "$AXIOM64_NATIVE_FIXTURES/account-store"
sudo -n python3 scripts/account_database_test.py --native --directory build/account-database-native --fixtures "$AXIOM64_NATIVE_FIXTURES/account-database"
sudo -n python3 scripts/account_update_test.py --native --directory build/account-update-native --fixtures "$AXIOM64_NATIVE_FIXTURES/account-update"
sudo -n python3 scripts/account_update_test.py --native --sanitize --directory build/account-update-sanitize --fixtures "$AXIOM64_NATIVE_FIXTURES/account-update-sanitize"
sudo -n python3 scripts/rename_test.py --native --directory build/account-rename-native --fixtures "$AXIOM64_NATIVE_FIXTURES/rename"
sudo -n python3 scripts/account_home_test.py --native --directory build/account-home-native --fixtures "$AXIOM64_NATIVE_FIXTURES/home"
sudo -n python3 scripts/account_home_test.py --native --sanitize --directory build/account-home-sanitize --fixtures "$AXIOM64_NATIVE_FIXTURES/home-sanitize"
sudo -n python3 scripts/account_transaction_test.py --native --directory build/account-transaction-native --fixtures "$AXIOM64_NATIVE_FIXTURES/transaction"
sudo -n python3 scripts/account_transaction_test.py --native --sanitize --directory build/account-transaction-sanitize --fixtures "$AXIOM64_NATIVE_FIXTURES/transaction-sanitize"
'''

