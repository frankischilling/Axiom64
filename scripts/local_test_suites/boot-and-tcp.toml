name = "Independently verify legacy native TCP source and runtime inputs"
run = '''
case "$SUITE" in
  tcp-fault-loss) prefix=tcp-fault ;;
  tcp-fault-reordering) prefix=tcp-reordering ;;
  tcp-fault-persist) prefix=tcp-persist ;;
  tcp-fault-timeout) prefix=tcp-timeout ;;
  tcp-fault-old-ack) prefix=tcp-old-ack ;;
  tcp-fault-challenge) prefix=tcp-challenge ;;
  tcp-lifetime-native) prefix=tcp-lifetime ;;
  *) exit 1 ;;
esac
python3 scripts/tcp_native_inputs.py "build/$prefix-native-results.json" 2>&1 | tee "build/$prefix-native-inputs.log"
if [ "$prefix" = tcp-fault ]; then
  python3 scripts/tests/tcp_native_inputs_test.py "build/$prefix-native-results.json" 2>&1 | tee "build/$prefix-native-inputs-damage.log"
fi
'''

