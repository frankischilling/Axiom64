name: Build and boot
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      manager_accelerator:
        description: Accelerator for measured normal-init and carrier/failure VM runs
        type: choice
        default: tcg
        options: [tcg, auto, kvm]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      account_clean_matrix: ${{ steps.storage_matrices.outputs.account_clean_matrix }}
      account_fault_matrix: ${{ steps.storage_matrices.outputs.account_fault_matrix }}
      account_rotation_matrix: ${{ steps.storage_matrices.outputs.account_rotation_matrix }}
      rotation_shard_count: ${{ steps.storage_matrices.outputs.rotation_shard_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build and emulation tools
        run: bash scripts/ci/tools.sh prepare
      - name: Cache locked dependency and source archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ runner.os }}-downloads-v1-${{ hashFiles('dependencies.json', 'ports.lock.json', 'sources.lock.json', 'vendor/gnu-utmp-reader/inputs.json') }}
          path: |
            downloads/*.tar.*
            downloads/cacert-*.pem
            downloads/ports
            downloads/sources
      - name: Test crypto cache input invalidation and complete product retention
        run: python3 scripts/tests/crypto_cache_test.py -v
      - name: Test authenticated Ubuntu index identity and retained download failures
        run: python3 scripts/tests/host_glibc_sources_test.py -v
      - name: Fingerprint crypto recipes and actual host toolchain inputs
        id: crypto_cache_inputs
        run: python3 scripts/ci/crypto_cache.py --report build/crypto-cache/inputs.json >> "$GITHUB_OUTPUT"
      - name: Cache completed crypto libraries and staged tools
        id: crypto_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.crypto_cache_inputs.outputs.key }}
          path: ${{ steps.crypto_cache_inputs.outputs.paths }}
      - name: Check C and C++ formatting
        run: make check-format
      - name: Test QEMU accelerator selection and actual monitor evidence
        run: python3 scripts/tests/qemu_acceleration_test.py
      - name: Test init supervision observes complete serial records
        run: python3 scripts/tests/normal_manager_events_test.py -v
      - name: Replay authenticated console prompts and command return ordering
        run: python3 scripts/tests/normal_login_test.py -v
      - name: Replay actual kernel-interrupted ordinary Bash prompts
        run: python3 scripts/tests/console_prompt_test.py -v
      - name: Check complete and focused input archive boundaries
        run: |
          python3 scripts/tests/ci_inputs_test.py -v
          python3 scripts/tests/ci_tools_test.py -v
      - name: Run prompt verification from exported corresponding-source inputs
        run: python3 scripts/tests/source_bundle_inputs_test.py -v
      - name: Test seed supervision observes complete ordinary-console records
        run: python3 scripts/tests/random_installed_records_test.py -v
      - name: Test actual init seed records stay framed at every input-echo boundary
        run: python3 scripts/tests/random_seed_records_producer_test.py -v
      - name: Test copied fixture executables retain Linux execution permissions
        run: python3 scripts/tests/random_executable_copy_test.py -v
      - name: Replay actual RTC firmware writes and reject damaged calendar observations
        run: python3 scripts/tests/clock_wall_observer_test.py -v
      - name: Require complete and unaltered storage target shard unions
        run: python3 scripts/tests/account_storage_shards_test.py -v
      - name: Require every rotation variant, target and actual fault mode
        run: python3 scripts/tests/account_rotation_coverage_test.py -v
      - name: Replay retained account generation selection through a separate Linux journal oracle
        run: python3 scripts/tests/account_generation_oracle_test.py -v
      - name: Classify retained rotation retirement after journal-only observation
        run: python3 scripts/tests/account_rotation_journal_oracle_test.py -v
      - name: Replay actual QMP startup notifications within the negotiation deadline
        run: python3 scripts/tests/qmp_greeting_test.py -v
      - name: Preserve actual administration disks and reap interrupted observation children
        run: python3 scripts/tests/account_management_storage_test.py
      - name: Reject unproven provisional rotation archives
        run: python3 scripts/tests/account_rotation_storage_test.py
      - name: Replay actual kernel-interrupted rotation exports without changing captured bytes
        run: python3 scripts/tests/account_rotation_serial_test.py -v
      - name: Verify bounded rotation device storage
        run: python3 scripts/tests/account_rotation_disk_test.py -v
      - name: Require exact allocation-map evidence for bounded counter recovery
        run: python3 scripts/tests/ext2_counter_inspection_test.py
      - name: Require every administration variant, concurrency phase and storage fault
        run: python3 scripts/tests/account_management_coverage_test.py -v
      - name: Require complete bounded CI storage matrices
        run: python3 scripts/tests/account_storage_ci_test.py -v
      - name: Publish root-created storage evidence through an ordinary runner
        run: sudo -n python3 scripts/tests/account_storage_publication_test.py
      - name: Define complete account storage matrices
        id: storage_matrices
        run: python3 scripts/account_storage_ci.py >> "$GITHUB_OUTPUT"
      - name: Test manager runtime hint provenance and explicit invalidation with sanitizers
        run: make test-manager-runtime-native
      - name: Test actual desktop image readiness and bounded uniform-image rejection
        run: python3 scripts/tests/desktop_visual_test.py -v
      - name: Test Xauthority records against an isolated real X server and ordinary users
        run: sudo -n python3 scripts/tests/desktop_authority_test.py --isolated
      - name: Test the selected shell starts only on a private owned foreground PTY
        run: sudo -n python3 scripts/tests/desktop_terminal_test.py
      - name: Test desktop recovery ownership and saved process identity
        run: |
          mkdir -p build/accounts-policy
          sudo -n python3 scripts/tests/desktop_seat_test.py 2>&1 | tee build/accounts-policy/seat.log
          sudo -n python3 scripts/tests/desktop_seat_test.py --sanitize 2>&1 | tee build/accounts-policy/seat-sanitize.log
      - name: Test process identity and exec capture failures with sanitizers
        run: |
          make test-proc-identity-policy test-exec-arguments-policy 2>&1 | tee build/accounts-policy/process.log
      - name: Compare process resource-limit policy with native Linux under sanitizers
        run: make test-process-limits-policy
      - name: Verify the portable GNU login-record reader and its pinned inputs
        run: python3 scripts/tests/gnu_utmp_reader_test.py --directory build/gnu-reader-controls
      - name: Build all maintained OpenSSL providers from their pinned inputs
        run: python3 scripts/build_openssl.py --provider all
      - name: Verify completed OpenSSL fingerprints and reject changed inputs and products
        run: python3 scripts/tests/openssl_inputs_test.py -v
      - name: Build authenticated curl and libcurl with all explicit libc providers
        run: python3 scripts/build_curl.py --provider all
      - name: Verify the dated public CA bundle against its offline Mozilla conversion
        run: |
          python3 scripts/ca_bundle.py
          python3 scripts/tests/ca_bundle_test.py -v
      - name: Verify every completed crypto product is retained by the cache
        run: |
          python3 scripts/ci/crypto_cache.py --check --report build/crypto-cache/products.json
          printf '%s\n' '${{ steps.crypto_cache.outputs.cache-hit }}' > build/crypto-cache/cache-hit.txt
      - name: Build maintained password providers and account programs
        run: |
          python3 scripts/build_libxcrypt.py --provider all
          python3 scripts/build_accounts.py --provider all --linkage all
      - name: Build secure-random lifecycle and cryptographic prerequisite clients
        run: |
          make -j2 build/random-admin-native build/random-admin-static build/random-admin-dynamic
          make -j2 build/random-seed-native build/random-seed-static build/random-seed-dynamic
          make -j2 build/random-seed-probe-native build/random-seed-probe-static build/random-seed-probe-dynamic
          make -j2 build/random-seed-fault-static build/random-seed-fault-dynamic
          make -j2 build/random-seed-stop-static build/random-seed-stop-dynamic
          make -j2 build/random-seed-crash-static build/random-seed-crash-dynamic
          make -j2 build/random-seed-recovery-static build/random-seed-recovery-dynamic
          make -j2 build/random-snapshot-static build/random-snapshot-dynamic
          make -j2 build/generation-exec-static build/generation-exec-dynamic
          make -j2 build/crypto-wait-native build/crypto-wait-static build/crypto-wait-dynamic
          make -j2 build/clock-wall-native build/clock-wall-static build/clock-wall-dynamic
          make -j2 build/netlink-inventory-native build/netlink-inventory-static build/netlink-inventory-dynamic
      - name: Test entropy, generation, calendar and inventory policies with sanitizers
        run: |
          make test-random-native test-random-virtio-native test-random-generation-native
          make test-rtc-codec test-netlink-inventory-codec
      - name: Bundle corresponding sources
        run: make sources
      - name: Execute and relink the GNU reader extracted from this run's public source artifact
        run: |
          python3 scripts/tests/gnu_utmp_reader_test.py --directory build/gnu-reader-public-controls --source-archive build/axiom64-sources.tar
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          kit = Path('build/gnu-reader-public-controls/moved-kit')
          manifest = json.loads((kit / 'manifest.json').read_text())
          assert hashlib.sha256((kit / 'application.c').read_bytes()).hexdigest() == manifest['source_sha256']
          print('GNU_UTMP_READER_PUBLIC_SOURCE_BINDING_PASS')
          PY
      - name: Build standalone image and both userspace profiles
        run: |
          make -j2 image
          make build/rootfs-desktop.cpio
          make -j2 build/network-manager-dynamic build/network-manager-faults build/network-manager-dynamic-faults build/manager-tests build/manager-protocol build/manager-link
          sudo python3 scripts/address_query_test.py
          make -j2 build/random-static build/random-dynamic
          make -j2 build/dns-static build/dns-dynamic
          make -j2 build/dns-tcp-static build/dns-tcp-dynamic
          make -j2 build/normal-dns-static build/normal-dns-dynamic
          make -j2 build/credentials-native build/credentials-static build/credentials-dynamic
          make -j2 build/file-capabilities-native build/file-capabilities-static build/file-capabilities-dynamic
          python3 scripts/build_libcap.py --provider all
          make -j2 build/tcp-native build/tcp-static build/tcp-dynamic
          make -j2 build/tcp-fault-native build/tcp-fault-static build/tcp-fault-dynamic
          make -j2 build/tcp-challenge-native build/tcp-challenge-static build/tcp-challenge-dynamic
          make -j2 build/tcp-malformed-native build/tcp-malformed-static build/tcp-malformed-dynamic
          make -j2 build/tcp-device-native build/tcp-device-static build/tcp-device-dynamic
          make -j2 build/tcp-window-native build/tcp-window-static build/tcp-window-dynamic
          make -j2 build/tcp-timeout-native build/tcp-timeout-static build/tcp-timeout-dynamic
          make -j2 build/tcp-lifetime-native build/tcp-lifetime-static build/tcp-lifetime-dynamic
          make -j2 build/tcp-icmp-native build/tcp-icmp-static build/tcp-icmp-dynamic
          make -j2 build/tcp-pmtu-native build/tcp-pmtu-static build/tcp-pmtu-dynamic
          make -j2 build/tcp-pressure-native build/tcp-pressure-static build/tcp-pressure-dynamic
          make -j2 build/tcp-reconnect-native build/tcp-reconnect-static build/tcp-reconnect-dynamic
          make -j2 build/tcp-recovery-native build/tcp-recovery-static build/tcp-recovery-dynamic
          make build/init-supervision
      - name: Test split-queue ownership with sanitizers
        run: make test-virtqueue
      - name: Test credential policy ownership and allocation failures with sanitizers
        run: make test-credentials-policy
      - name: Test bounded file-capability policy, xattr allocation and actual ext2 EA codecs
        run: |
          make test-file-capabilities-policy test-xattr-store test-ext2-xattr-codec
          python3 scripts/tests/file_capabilities_disk_test.py
      - name: Test TCP wire, sender and connection policies with sanitizers
        run: |
          mkdir -p build/tcp-policy
          make test-tcp-wire test-tcp-sender test-tcp-connection test-tcp-isn test-tcp-time-wait test-tcp-icmp test-tcp-pmtu 2>&1 | tee build/tcp-policy/host.log
          python3 scripts/tests/tcp_input_libraries_test.py
          python3 scripts/tests/tcp_reconnect_clock_test.py -v 2>&1 | tee build/tcp-policy/reconnect-clock.log
          python3 scripts/tests/tcp_reconnect_observer_test.py -v 2>&1 | tee build/tcp-policy/reconnect-observer.log
      - name: Test IPv4 fragment ownership and reassembly with sanitizers
        run: |
          mkdir -p build/ipv4-policy
          python3 scripts/tests/network_fixture_test.py 2>&1 | tee build/ipv4-policy/fixture.log
          python3 scripts/tests/ipv6_configuration_test.py 2>&1 | tee build/ipv4-policy/ipv6-configuration.log
          python3 scripts/tests/ipv6_router_capture_test.py 2>&1 | tee build/ipv4-policy/ipv6-router-capture.log
          python3 scripts/tests/tcp_capture_lifecycle_test.py -v 2>&1 | tee build/ipv4-policy/capture-lifecycle.log
          python3 scripts/tests/ipv6_dad_policy_test.py -v 2>&1 | tee build/ipv4-policy/ipv6-dad-policy.log
          python3 scripts/tests/ipv6_dad_launch_test.py -v 2>&1 | tee build/ipv4-policy/ipv6-dad-launch.log
          python3 scripts/tests/ipv6_dad_inventory_test.py --directory build/ipv4-policy/ipv6-dad-inventory -v 2>&1 | tee build/ipv4-policy/ipv6-dad-inventory.log
          python3 scripts/tests/ipv6_dad_capture_test.py --archive build/ipv4-policy/ipv6-dad-damaged.zip -v 2>&1 | tee build/ipv4-policy/ipv6-dad-capture.log
          python3 scripts/tests/ipv6_owner_peer_test.py -v 2>&1 | tee build/ipv4-policy/ipv6-owner-peer.log
          python3 scripts/tests/ipv6_owner_launch_test.py -v 2>&1 | tee build/ipv4-policy/ipv6-owner-launch.log
          python3 scripts/tests/ipv6_owner_capture_test.py --archive build/ipv4-policy/ipv6-owner-damaged.zip -v 2>&1 | tee build/ipv4-policy/ipv6-owner-capture.log
          python3 scripts/tests/dns_fixture_test.py 2>&1 | tee build/ipv4-policy/dns-fixture.log
          python3 scripts/tests/ipv4_aliases_test.py 2>&1 | tee build/ipv4-policy/aliases.log
          python3 scripts/tests/ipv4_fragment_observation_test.py -v 2>&1 | tee build/ipv4-policy/fragment-observation.log
          python3 scripts/tests/ipv4_fragment_diagnostics_test.py --directory build/ipv4-policy/fragment-diagnostics -v 2>&1 | tee build/ipv4-policy/fragment-diagnostics.log
          python3 scripts/tests/ipv4_expiry_damage_test.py -v 2>&1 | tee build/ipv4-policy/expiry-damage.log
          make test-ipv6-wire test-ipv4-reassembly test-ipv4-fragmentation test-ipv4-path-mtu test-ipv4-paths 2>&1 | tee build/ipv4-policy/host.log
      - name: Upload IPv4 policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ipv4-policy
          if-no-files-found: warn
          path: build/ipv4-policy
      - name: Upload TCP policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcp-policy
          if-no-files-found: warn
          path: build/tcp-policy
      - name: Upload native address withdrawal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-address-query-native
          if-no-files-found: error
          path: build/address-query-*
      - name: Upload account policy and portable reader evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-account-policy
          path: |
            build/accounts-policy
            build/gnu-reader-controls
            build/gnu-reader-public-controls
            build/gnu-utmp-reader
            build/crypto-cache
      - name: Test paired network workspace isolation and failure evidence
        run: python3 scripts/tests/paired_network_test.py
      - name: Test PCI removal preserves interrupted guest reads
        run: |
          python3 scripts/manager_link_peer_test.py
          python3 scripts/tests/manager_link_hardware_test.py
      - name: Upload sources and recipes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-sources
          compression-level: 0
          if-no-files-found: error
          path: build/axiom64-sources.tar
      - name: Pack this run's test inputs
        # Keep source/output timestamps and executable modes together so make
        # can reuse this commit's build in each isolated test workspace.
        run: bash scripts/ci/inputs.sh full
      - name: Pack rotation inputs without unrelated ports or root images
        run: bash scripts/ci/inputs.sh rotation
      - name: Share test inputs with isolated jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-ci-inputs
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/ci-inputs.tar.gz
      - name: Share focused rotation inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-ci-rotation-inputs
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/ci-rotation-inputs.tar.gz
      - name: Upload boot image and kernel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-boot
          path: |
            build/axiom64.iso
            build/axiom64.elf
            build/busybox-build.log

  tests:
    name: Test ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite:
          - boot
          - network
          - ipv6-expiry
          - configuration
          - storage
          - storage-journal
          - storage-journal-lifetime-bios-modern
          - storage-journal-lifetime-bios-legacy
          - storage-journal-lifetime-uefi-modern
          - storage-journal-lifetime-uefi-legacy
          - root
          - root-userspace
          - manager-bios-modern
          - manager-bios-legacy
          - manager-uefi-modern
          - manager-uefi-legacy
          - random
          - random-devices
          - random-seeds-native
          - random-seeds-bios-modern
          - random-seeds-bios-legacy
          - random-seeds-uefi-modern
          - random-seeds-uefi-legacy
          - random-crypto-native
          - random-crypto-bios
          - random-crypto-uefi
          - random-crypto-prerequisites
          - downloads-native
          - downloads-bios-modern
          - downloads-bios-legacy
          - downloads-uefi-modern
          - downloads-uefi-legacy
          - random-installed-bios
          - random-installed-uefi
          - credentials
          - file-capabilities
          - resource-limits-native
          - resource-limits
          - resource-limits-storage
          - tcp
          - tcp-fault-loss
          - tcp-fault-reordering
          - tcp-fault-persist
          - tcp-fault-timeout
          - tcp-fault-old-ack
          - tcp-fault-challenge
          - tcp-fault-icmp
          - tcp-lifetime-native
          - tcp-lifetime-bios-modern
          - tcp-lifetime-bios-legacy
          - tcp-lifetime-uefi-modern
          - tcp-lifetime-uefi-legacy
          - normal-init-bios
          - normal-init-uefi
          - protocol-bios-modern-lane0
          - protocol-bios-modern-lane1
          - protocol-bios-legacy-lane0
          - protocol-bios-legacy-lane1
          - protocol-uefi-modern-lane0
          - protocol-uefi-modern-lane1
          - protocol-uefi-legacy-lane0
          - protocol-uefi-legacy-lane1
          - link-bios-modern-lane0
          - link-bios-modern-lane1
          - link-bios-legacy-lane0
          - link-bios-legacy-lane1
          - link-uefi-modern-lane0
          - link-uefi-modern-lane1
          - link-uefi-legacy-lane0
          - link-uefi-legacy-lane1
          - accounts-native-storage
          - accounts-native-auth
          - accounts-native-session
          - accounts-native-frontends
          - accounts-guest-storage
          - accounts-store-ext2
          - accounts-guest-auth
          - accounts-guest-session
          - accounts-guest-frontends
          - accounts-process-native
          - accounts-process-guest
          - accounts-record-native
          - accounts-record-bios-modern
          - accounts-record-bios-legacy
          - accounts-record-uefi-modern
          - accounts-record-uefi-legacy
          - accounts-rotation-native
          - accounts-rotation-bios-modern
          - accounts-rotation-bios-legacy
          - accounts-rotation-uefi-modern
          - accounts-rotation-uefi-legacy
          - accounts-desktop-bios
          - accounts-desktop-uefi
          - accounts-console-full
          - accounts-vm-state
    steps:
      - name: Download this run's test inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          name: axiom64-ci-inputs
          path: ${{ runner.temp }}/ci-inputs
      - name: Restore source and build together
        run: tar -xzf "$RUNNER_TEMP/ci-inputs/ci-inputs.tar.gz"
      - name: Install build and emulation tools
        run: bash scripts/ci/tools.sh restore
      - name: Compare ordinary-user HTTP and authenticated HTTPS downloads with native Linux
        if: matrix.suite == 'downloads-native'
        run: |
          sudo -n python3 scripts/http_download_test.py --native --output build/http-downloads
          sudo -n python3 scripts/http_download_failure_native_test.py --output build/http-downloads/normal-native
          sudo -n python3 scripts/http_download_wget_native_test.py --output build/http-downloads/native-wget
      - name: Download real HTTP and authenticated HTTPS fixtures on both guest adapters
        if: startsWith(matrix.suite, 'downloads-') && matrix.suite != 'downloads-native'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          firmware="${SUITE#downloads-}"
          firmware="${firmware%-*}"
          transport="${SUITE##*-}"
          python3 scripts/http_download_test.py --firmware "$firmware" --transport "$transport" --output build/http-downloads
      - name: Independently read actual download sources, products and complete captures
        if: startsWith(matrix.suite, 'downloads-') && matrix.suite != 'downloads-native'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          firmware="${SUITE#downloads-}"
          firmware="${firmware%-*}"
          transport="${SUITE##*-}"
          python3 scripts/http_download_verify.py build/http-downloads --firmware "$firmware" --transport "$transport" --source-root . --negative-controls build/http-download-controls --report build/http-downloads/actual-evidence.json
      - name: Verify normal authenticated downloads and persistent reboots
        if: startsWith(matrix.suite, 'downloads-') && matrix.suite != 'downloads-native'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          firmware="${SUITE#downloads-}"
          firmware="${firmware%-*}"
          transport="${SUITE##*-}"
          sudo -n python3 scripts/http_download_normal_test.py --firmware "$firmware" --transport "$transport" --output build/http-download-normal
          sudo -n python3 scripts/http_download_normal_verify.py build/http-download-normal --firmware "$firmware" --transport "$transport" --source-root . --output build/http-download-normal-audit --negative-controls build/http-download-normal-audit/controls
      - name: Give the runner ownership of completed download evidence
        if: always() && startsWith(matrix.suite, 'downloads-')
        run: sudo -n bash scripts/ci/storage_evidence.sh "$(id -u)" "$(id -g)" build/http-downloads build/http-download-controls build/http-download-normal build/http-download-normal-audit
      - name: Upload actual download sources, clients, images, files and captures
        if: always() && startsWith(matrix.suite, 'downloads-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-${{ matrix.suite }}-evidence
          if-no-files-found: error
          compression-level: 1
          path: |
            build/http-downloads/**
            build/http-download-controls/**
            build/http-download-normal/**
            build/http-download-normal-audit/**
            !build/http-downloads/**/certificates/*.key
            !build/http-download-normal/**/certificates/*.key
      - name: Check actual joined-thread quota reclamation on separate native CPUs
        if: matrix.suite == 'resource-limits-native'
        run: sudo -n python3 scripts/tests/resource_thread_retirement_test.py
      - name: Compare resource quotas, signals and memory admission with native Linux
        if: matrix.suite == 'resource-limits-native'
        run: sudo -n python3 scripts/resource_limits_test.py --native --retain-host-source --directory build/resource-limits-native
      - name: Verify resource quotas and stack-aware exec across both libc providers and firmware modes
        if: matrix.suite == 'resource-limits'
