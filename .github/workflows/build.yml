name: Build and boot
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  diagnose:
    name: Diagnose retained IPv6 send failure
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install syscall observer
        run: sudo apt-get update && sudo apt-get install -y strace musl-tools
      - name: Retrieve original required-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api repos/frankischilling/Axiom64/actions/artifacts/14212222196/zip > build/original.zip
          echo 'f42aa4c0d840232284bd84ee9c2bd21e4f83ea78b576654304f472c3d86f2074  build/original.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('build/retained').resolve()
          with zipfile.ZipFile('build/original.zip') as archive:
              for member in archive.infolist():
                  if member.filename.startswith('ipv6-errors-native-wire/'):
                      path = (root / member.filename).resolve()
                      assert path.is_relative_to(root)
                      if not member.is_dir():
                          path.parent.mkdir(parents=True, exist_ok=True)
                          path.write_bytes(archive.read(member))
          PY
      - name: Build paired full and metadata-only diagnostic clients
        run: |
          mkdir -p build/diagnostic-uapi
          cp -a /usr/include/linux /usr/include/asm-generic /usr/include/x86_64-linux-gnu/asm build/diagnostic-uapi/
          musl-gcc -isystem build/diagnostic-uapi -Iuserspace/tests/net -std=c11 -O2 -g -Wall -Wextra -Werror -DIPV6_ERROR_CONTROLS_INTEGRATED userspace/tests/net/ipv6_errors.c userspace/tests/net/ipv6_error_controls.c userspace/tests/net/ipv6_error_metadata.c userspace/tests/net/ipv6_receive_extensions.c -o build/diagnostic-rebuilt
          musl-gcc -isystem build/diagnostic-uapi -Iuserspace/tests/net -std=c11 -O2 -g -Wall -Wextra -Werror scripts/ipv6_error_metadata_minimum.c userspace/tests/net/ipv6_error_metadata.c -o build/diagnostic-minimum
          python3 - <<'PY'
          from pathlib import Path
          original = Path('userspace/tests/net/ipv6_errors.c').read_text()
          local_begin = original.index('    check(!ipv6_receive_extensions_local()', original.index('int main('))
          local_end = original.index('    if (argc == 2', local_begin)
          Path('build/diagnostic-wire.c').write_text(original[:local_begin] + original[local_end:])
          wire = '    for (unsigned lane = 0; lane < 2; lane++)\n        wire(lane);\n'
          assert original.count(wire) == 1
          Path('build/diagnostic-local.c').write_text(original.replace(wire, '', 1))
          reduced = Path('build/diagnostic-wire.c').read_text()
          for lane in (0, 1):
              Path(f'build/diagnostic-wire{lane}.c').write_text(reduced.replace(wire, f'    wire({lane});\n', 1))
          minimum = Path('scripts/ipv6_error_metadata_minimum.c').read_text()
          marker = '    check(!ipv6_error_metadata_wire'
          assert minimum.count(marker) == 1
          delayed = minimum.replace(marker, '    struct timespec interval = {38, 0};\n    check(!nanosleep(&interval, NULL), "diagnostic elapsed-time control");\n' + marker, 1)
          Path('build/diagnostic-delayed.c').write_text(delayed)
          PY
          for variant in wire local wire0 wire1 delayed; do
            musl-gcc -isystem build/diagnostic-uapi -Iuserspace/tests/net -std=c11 -O2 -g -Wall -Wextra -Werror -Wno-unused-function -DIPV6_ERROR_CONTROLS_INTEGRATED build/diagnostic-$variant.c userspace/tests/net/ipv6_error_controls.c userspace/tests/net/ipv6_error_metadata.c userspace/tests/net/ipv6_receive_extensions.c -o build/diagnostic-$variant
          done
          sha256sum build/diagnostic-rebuilt build/diagnostic-minimum
      - name: Check shared neighbor reservation ownership and restoration
        run: |
          cp scripts/native_neighbor_capacity.py build/diagnostic-native-neighbor-capacity.py
          cp scripts/tests/native_neighbor_capacity_test.py build/diagnostic-native-neighbor-capacity-test.py
          sudo -n python3 -B scripts/tests/native_neighbor_capacity_test.py 2>&1 | tee build/diagnostic-native-neighbor-capacity-test.log
      - name: Run fixed diagnosis plan with original client bytes
        run: sudo -n python3 -B scripts/ipv6_error_send_diagnostic.py --retained build/retained --output build/send-diagnostic
      - name: Retain every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ipv6-send-diagnostic
          if-no-files-found: error
          path: |
            build/send-diagnostic/
            build/diagnostic-rebuilt
            build/diagnostic-minimum
            build/diagnostic-wire
            build/diagnostic-local
            build/diagnostic-wire.c
            build/diagnostic-local.c
            build/diagnostic-wire0
            build/diagnostic-wire1
            build/diagnostic-delayed
            build/diagnostic-wire0.c
            build/diagnostic-wire1.c
            build/diagnostic-delayed.c
            build/diagnostic-native-neighbor-capacity.py
            build/diagnostic-native-neighbor-capacity-test.py
            build/diagnostic-native-neighbor-capacity-test.log
            build/diagnostic-uapi/
