name: Build and boot
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      manager_accelerator:
        description: Accelerator for measured normal-init and carrier/failure VM runs
        type: choice
        default: tcg
        options: [tcg, auto, kvm]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build and emulation tools
        run: bash scripts/ci/tools.sh prepare
      - name: Cache locked dependency and source archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ runner.os }}-downloads-v1-${{ hashFiles('dependencies.json', 'ports.lock.json', 'sources.lock.json') }}
          path: |
            downloads/*.tar.*
            downloads/ports
            downloads/sources
      - name: Check C and C++ formatting
        run: make check-format
      - name: Test QEMU accelerator selection and actual monitor evidence
        run: python3 scripts/tests/qemu_acceleration_test.py
      - name: Test init supervision observes complete serial records
        run: python3 scripts/tests/normal_manager_events_test.py -v
      - name: Test manager runtime hint provenance and explicit invalidation with sanitizers
        run: make test-manager-runtime-native
      - name: Test actual desktop image readiness and bounded uniform-image rejection
        run: python3 scripts/tests/desktop_visual_test.py -v
      - name: Bundle corresponding sources
        run: make sources
      - name: Build standalone image and both userspace profiles
        run: |
          make -j2 image
          make build/rootfs-desktop.cpio
          make -j2 build/network-manager-dynamic build/network-manager-faults build/network-manager-dynamic-faults build/manager-tests build/manager-protocol build/manager-link
          make -j2 build/random-static build/random-dynamic
          make -j2 build/dns-static build/dns-dynamic
          make -j2 build/normal-dns-static build/normal-dns-dynamic
          make -j2 build/credentials-native build/credentials-static build/credentials-dynamic
          make -j2 build/tcp-native build/tcp-static build/tcp-dynamic
          make -j2 build/tcp-fault-native build/tcp-fault-static build/tcp-fault-dynamic
          make -j2 build/tcp-challenge-native build/tcp-challenge-static build/tcp-challenge-dynamic
          make -j2 build/tcp-timeout-native build/tcp-timeout-static build/tcp-timeout-dynamic
          make -j2 build/tcp-lifetime-native build/tcp-lifetime-static build/tcp-lifetime-dynamic
          make build/init-supervision
      - name: Test split-queue ownership with sanitizers
        run: make test-virtqueue
      - name: Test credential policy ownership and allocation failures with sanitizers
        run: make test-credentials-policy
      - name: Test TCP wire, sender and connection policies with sanitizers
        run: |
          mkdir -p build/tcp-policy
          make test-tcp-wire test-tcp-sender test-tcp-connection test-tcp-isn test-tcp-time-wait 2>&1 | tee build/tcp-policy/host.log
      - name: Upload TCP policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcp-policy
          if-no-files-found: warn
          path: build/tcp-policy
      - name: Test paired network workspace isolation and failure evidence
        run: python3 scripts/tests/paired_network_test.py
      - name: Test PCI removal preserves interrupted guest reads
        run: |
          python3 scripts/manager_link_peer_test.py
          python3 scripts/tests/manager_link_hardware_test.py
      - name: Upload sources and recipes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-sources
          compression-level: 0
          if-no-files-found: error
          path: build/axiom64-sources.tar
      - name: Pack this run's test inputs
        # Keep source/output timestamps and executable modes together so make
        # can reuse this commit's build in each isolated test workspace.
        run: |
          busybox_dir=$(python3 -c "import json; print('build/busybox-' + json.load(open('dependencies.json'))['busybox']['version'])")
          tar -cf "$RUNNER_TEMP/ci-inputs.tar" \
            --exclude='./.git' --exclude='./.local' --exclude='__pycache__' \
            --exclude='./downloads/sources' --exclude='./build/axiom64-sources.tar' \
            --exclude='./build/axiom64.iso' --exclude='./build/iso*' \
            --exclude='./build/busybox-*' --exclude='./build/uapi' \
            . "$busybox_dir/busybox" "$busybox_dir/.config" "$busybox_dir/LICENSE"
          gzip -1 "$RUNNER_TEMP/ci-inputs.tar"
      - name: Share test inputs with isolated jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-ci-inputs
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/ci-inputs.tar.gz
      - name: Upload boot image and kernel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-boot
          path: |
            build/axiom64.iso
            build/axiom64.elf
            build/busybox-build.log

  tests:
    name: Test ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite:
          - boot
          - network
          - configuration
          - storage
          - root
          - root-userspace
          - manager-bios-modern
          - manager-bios-legacy
          - manager-uefi-modern
          - manager-uefi-legacy
          - random
          - credentials
          - tcp
          - tcp-fault-loss
          - tcp-fault-reordering
          - tcp-fault-persist
          - tcp-fault-timeout
          - tcp-fault-old-ack
          - tcp-fault-challenge
          - tcp-lifetime-native
          - tcp-lifetime-bios-modern
          - tcp-lifetime-bios-legacy
          - tcp-lifetime-uefi-modern
          - tcp-lifetime-uefi-legacy
          - normal-init-bios
          - normal-init-uefi
          - protocol-bios-modern-lane0
          - protocol-bios-modern-lane1
          - protocol-bios-legacy-lane0
          - protocol-bios-legacy-lane1
          - protocol-uefi-modern-lane0
          - protocol-uefi-modern-lane1
          - protocol-uefi-legacy-lane0
          - protocol-uefi-legacy-lane1
          - link-bios-modern-lane0
          - link-bios-modern-lane1
          - link-bios-legacy-lane0
          - link-bios-legacy-lane1
          - link-uefi-modern-lane0
          - link-uefi-modern-lane1
          - link-uefi-legacy-lane0
          - link-uefi-legacy-lane1
    steps:
      - name: Download this run's test inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: axiom64-ci-inputs
          path: ${{ runner.temp }}/ci-inputs
      - name: Restore source and build together
        run: tar -xzf "$RUNNER_TEMP/ci-inputs/ci-inputs.tar.gz"
      - name: Install build and emulation tools
        run: bash scripts/ci/tools.sh restore
      - name: Prepare optional KVM access for measured manager VM runs
        if: (startsWith(matrix.suite, 'link-') || startsWith(matrix.suite, 'normal-init-')) && (inputs.manager_accelerator == 'auto' || inputs.manager_accelerator == 'kvm')
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi

      - name: Observe complete default TCP lifetimes with all three native linkages
        if: matrix.suite == 'tcp-lifetime-native'
        run: |
          sudo -n make test-tcp-lifetime-native
          python3 scripts/tcp_lifetime/capture.py --report tcp-lifetime-native-results.json 2>&1 | tee build/tcp-lifetime-capture.log
          python3 scripts/tcp_lifetime/damaged.py 2>&1 | tee build/tcp-lifetime-damage.log
      - name: Observe complete default TCP lifetimes with both guest linkages and NICs
        if: startsWith(matrix.suite, 'tcp-lifetime-') && matrix.suite != 'tcp-lifetime-native'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in tcp-lifetime-bios-modern|tcp-lifetime-bios-legacy|tcp-lifetime-uefi-modern|tcp-lifetime-uefi-legacy) ;; *) exit 1 ;; esac
          configuration=${SUITE#tcp-lifetime-}
          firmware=${configuration%-*}
          transport=${configuration##*-}
          python3 scripts/tcp_lifetime/acceptance.py guest --firmware "$firmware" --transport "$transport"
          python3 scripts/tcp_lifetime/capture.py --report "tcp-lifetime-${configuration}-results.json" 2>&1 | tee build/tcp-lifetime-capture.log
          python3 scripts/tcp_lifetime/damaged.py 2>&1 | tee build/tcp-lifetime-damage.log
      - name: Test BIOS and UEFI userspace
        if: matrix.suite == 'boot'
        run: python3 scripts/boot_test.py --firmware both
      - name: Compare identities and permissions with native Linux and both musl linkages
        if: matrix.suite == 'credentials'
        run: sudo -n make test-credentials-native
      - name: Test ordinary identities, privilege-dropped exec and RAM/ext2 permissions
        if: matrix.suite == 'credentials'
        run: make test-credentials
      - name: Compare TCP stream sockets with native Linux and both musl linkages
        if: matrix.suite == 'tcp'
        run: make test-tcp-native
      - name: Test static and dynamic TCP loopback with BIOS and UEFI
        if: matrix.suite == 'tcp'
        run: make test-tcp-sockets
      - name: Test native host TCP client/server transfers and independent NIC captures
        if: matrix.suite == 'tcp'
        run: make test-tcp-native-wire
      - name: Reject damaged actual TCP captures
        if: matrix.suite == 'tcp'
        run: python3 scripts/tests/tcp_capture_test.py 2>&1 | tee build/tcp-capture-checker.log
      - name: Compare controlled TCP loss with isolated native Linux
        if: matrix.suite == 'tcp-fault-loss'
        run: sudo -n make test-tcp-fault-native
      - name: Verify actual TCP retransmissions on both emulated NICs
        if: matrix.suite == 'tcp-fault-loss'
        run: make test-tcp-fault
      - name: Independently verify TCP loss captures and reject damaged evidence
        if: matrix.suite == 'tcp-fault-loss'
        run: |
          python3 scripts/tcp_fault_capture.py 2>&1 | tee build/tcp-fault-capture.log
          python3 scripts/tests/tcp_fault_capture_test.py 2>&1 | tee build/tcp-fault-capture-checker.log
      - name: Compare receive reordering with isolated native Linux
        if: matrix.suite == 'tcp-fault-reordering'
        run: sudo -n make test-tcp-reordering-native
      - name: Verify receive holes, duplicates and overlaps on both emulated NICs
        if: matrix.suite == 'tcp-fault-reordering'
        run: make test-tcp-reordering
      - name: Independently verify receive ordering and reject damaged evidence
        if: matrix.suite == 'tcp-fault-reordering'
        run: |
          python3 scripts/tcp_reordering_capture.py 2>&1 | tee build/tcp-reordering-capture.log
          python3 scripts/tests/tcp_reordering_capture_test.py 2>&1 | tee build/tcp-reordering-capture-checker.log
      - name: Compare zero-window persist with isolated native Linux
        if: matrix.suite == 'tcp-fault-persist'
        run: sudo -n make test-tcp-persist-native
      - name: Verify stopped-window probes and recovery on both emulated NICs
        if: matrix.suite == 'tcp-fault-persist'
        run: make test-tcp-persist
      - name: Independently verify persist timing and reject damaged evidence
        if: matrix.suite == 'tcp-fault-persist'
        run: |
          python3 scripts/tcp_persist_capture.py 2>&1 | tee build/tcp-persist-capture.log
          python3 scripts/tests/tcp_persist_capture_test.py 2>&1 | tee build/tcp-persist-capture-checker.log
      - name: Compare configured TCP user timeout with isolated native Linux
        if: matrix.suite == 'tcp-fault-timeout'
        run: sudo -n make test-tcp-timeout-native
      - name: Verify TCP timeout errors and disabled-timeout recovery on both emulated NICs
        if: matrix.suite == 'tcp-fault-timeout'
        run: make test-tcp-timeout
      - name: Independently verify TCP deadline evidence and reject damaged captures
        if: matrix.suite == 'tcp-fault-timeout'
        run: |
          python3 scripts/tcp_timeout_capture.py 2>&1 | tee build/tcp-timeout-capture.log
          python3 scripts/tests/tcp_timeout_capture_test.py 2>&1 | tee build/tcp-timeout-capture-checker.log
      - name: Compare old-ACK rejection with isolated native Linux
        if: matrix.suite == 'tcp-fault-old-ack'
        run: sudo -n make test-tcp-old-ack-native
      - name: Reject poisoned old-ACK payload and FIN on both emulated NICs
        if: matrix.suite == 'tcp-fault-old-ack'
        run: make test-tcp-old-ack
      - name: Independently verify ACK boundaries and reject damaged evidence
        if: matrix.suite == 'tcp-fault-old-ack'
        run: |
          python3 scripts/tcp_old_ack_capture.py 2>&1 | tee build/tcp-old-ack-capture.log
          python3 scripts/tests/tcp_old_ack_capture_test.py 2>&1 | tee build/tcp-old-ack-capture-checker.log
      - name: Compare challenge ACK intervals with isolated native Linux
        if: matrix.suite == 'tcp-fault-challenge'
        run: sudo -n make test-tcp-challenge-native
      - name: Observe control bursts and per-connection silence on both emulated NICs
        if: matrix.suite == 'tcp-fault-challenge'
        run: make test-tcp-challenge
      - name: Independently verify challenge silence and reject damaged evidence
        if: matrix.suite == 'tcp-fault-challenge'
        run: |
          python3 scripts/tcp_challenge_capture.py 2>&1 | tee build/tcp-challenge-capture.log
          python3 scripts/tests/tcp_challenge_capture_test.py 2>&1 | tee build/tcp-challenge-capture-checker.log
      - name: Test desktop serial acceptance decisions
        if: matrix.suite == 'boot'
        run: python3 scripts/tests/desktop_console_test.py
      - name: Test pthread lifecycle, futexes, and blocked I/O
        if: matrix.suite == 'boot'
        run: make test-threads
      - name: Compare retained I/O and socket timeouts with native Linux
        if: matrix.suite == 'boot'
        run: sudo -n make test-thread-io-native
      - name: Test virtio queue sizes and offered features
        if: matrix.suite == 'boot'
        run: make test-virtio
      - name: Test normal desktop startup
        if: matrix.suite == 'boot'
        run: python3 scripts/boot_test.py --interactive --firmware both --timeout 180

      - name: Test virtio and e1000 Ethernet with packet sockets
        if: matrix.suite == 'network'
        run: make test-network
      - name: Test IPv4 routes, ARP, raw ICMP, ping, and failed-device sockets
        if: matrix.suite == 'network'
        run: make test-ipv4
      - name: Test IPv4 UDP, datagram lifetime, checksums, and failed-device sockets
        if: matrix.suite == 'network'
        run: make test-udp
      - name: Compare common UDP socket behavior with native Linux
        if: matrix.suite == 'network'
        run: ./build/udp-tests
      - name: Compare actual musl DNS with native Linux in private namespaces
        if: matrix.suite == 'network'
        run: sudo -n make test-dns-native
      - name: Test musl DNS queries, search rules, retries, and deadlines on both adapters
        if: matrix.suite == 'network'
        run: make test-dns
      - name: Test route message validation with sanitizers
        if: matrix.suite == 'network'
        run: make test-netlink-codec
      - name: Test NETLINK_ROUTE ownership, lifetime, limits, and routed packets
        if: matrix.suite == 'network'
        run: make test-netlink
      - name: Compare route socket behavior with native Linux
        if: matrix.suite == 'network'
        run: |
          make build/netlink-native
          sudo python3 scripts/netlink_native.py

      - name: Test IPv4 address message validation with sanitizers
        if: matrix.suite == 'configuration'
        run: make test-address-codec
      - name: Test complete IPv4 addresses and configuration recovery
        if: matrix.suite == 'configuration'
        run: make test-configuration
      - name: Compare address messages with native Linux
        if: matrix.suite == 'configuration'
        run: |
          make build/configuration-native
          sudo python3 scripts/configuration_native.py
      - name: Test DHCP codecs, lease state, and profiles with sanitizers
        if: matrix.suite == 'configuration'
        run: make test-dhcp-codec
      - name: Test private saved files with sanitizers and musl under ordinary/root UIDs
        if: matrix.suite == 'configuration'
        run: |
          make -j2 build/profile-privacy-host build/profile-privacy-tests build/profile-privacy-dynamic
          sudo python3 scripts/profile_native.py
      - name: Test private saved profiles on guest RAM and ext2
        if: matrix.suite == 'configuration'
        run: make test-profiles
      - name: Test singleton ownership with native processes and both musl linkages
        if: matrix.suite == 'configuration'
        run: sudo make test-ownership-native
      - name: Test singleton ownership on guest RAM and ext2
        if: matrix.suite == 'configuration'
        run: make test-ownership
      - name: Test DHCP modules in Ring 3
        if: matrix.suite == 'configuration'
        run: make test-dhcp-modules
      - name: Test DHCP acquisition, renewal, rebinding, and owned configuration
        if: matrix.suite == 'configuration'
        run: make test-dhcp-transport
      - name: Test resolver metadata and publication failures with sanitizers
        if: matrix.suite == 'configuration'
        run: make test-resolver-native
      - name: Test resolver metadata, manual settings, and ownership recovery in Ring 3
        if: matrix.suite == 'configuration'
        run: make test-resolver
      - name: Test static address transitions and checked completion with sanitizers
        if: matrix.suite == 'manager-bios-modern'
        run: make test-static-address
      - name: Test cryptographic vectors and random source transitions with sanitizers
        if: matrix.suite == 'random'
        run: make test-random-native 2>&1 | tee build/random-native.log
      - name: Test initialized and early random interfaces with both musl linkages
        if: matrix.suite == 'random'
        run: python3 scripts/random_test.py --reseed --timeout 150
      - name: Test saved manager hints across independent ext2-root kernel boots
        if: matrix.suite == 'random'
        run: python3 scripts/manager_reboot_test.py
      - name: Test peer release validation across process and lease lifetimes
        if: matrix.suite == 'manager-bios-modern'
        run: python3 scripts/manager_peer_test.py
      - name: Test actual concurrent manager processes, wire exchanges, and publication/teardown failures
        if: startsWith(matrix.suite, 'manager-')
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            manager-bios-modern) firmware=bios; transport=modern ;;
            manager-bios-legacy) firmware=bios; transport=legacy ;;
            manager-uefi-modern) firmware=uefi; transport=modern ;;
            manager-uefi-legacy) firmware=uefi; transport=legacy ;;
            *) exit 2 ;;
          esac
          python3 scripts/manager_test.py --firmware "$firmware" --transport "$transport"
      - name: Test protocol peer packet shapes and serial controller barriers
        if: startsWith(matrix.suite, 'protocol-')
        run: python3 scripts/manager_protocol_peer_test.py 2>&1 | tee build/manager-protocol-peer.log
      - name: Test actual manager DHCP rejection, lease lifetimes, and conflict recovery
        if: startsWith(matrix.suite, 'protocol-')
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          python3 scripts/ci/paired_network.py --suite "$SUITE" \
            --archive "$RUNNER_TEMP/ci-inputs/ci-inputs.tar.gz" --temporary-parent "$RUNNER_TEMP"
      - name: Test carrier peer packets, physical removal, and observation barriers
        if: startsWith(matrix.suite, 'link-')
        run: |
          set -o pipefail
          python3 scripts/manager_link_peer_test.py 2>&1 | tee build/manager-link-peer.log
      - name: Test actual manager carrier transitions and failed-device cleanup
        if: startsWith(matrix.suite, 'link-')
        env:
          SUITE: ${{ matrix.suite }}
          AXIOM64_QEMU_ACCELERATOR: ${{ inputs.manager_accelerator || 'tcg' }}
        run: |
          python3 scripts/ci/paired_network.py --suite "$SUITE" \
            --archive "$RUNNER_TEMP/ci-inputs/ci-inputs.tar.gz" --temporary-parent "$RUNNER_TEMP"
      - name: Test counter scaling and ACPI discovery with sanitizers
        if: matrix.suite == 'configuration'
        run: make test-clock-codec 2>&1 | tee build/clock-codec.log
      - name: Test elapsed clocks and deadlines across delayed storage
        if: matrix.suite == 'configuration'
        run: make test-clock
      - name: Compare Linux file locks and test RAM/ext2 description lifetime
        if: matrix.suite == 'configuration'
        run: make test-file-locks

      - name: Test virtio disks and reboot persistence
        if: matrix.suite == 'storage'
        run: python3 scripts/storage_test.py
      - name: Test writable ext2 volumes and host fsck
        if: matrix.suite == 'storage'
        run: python3 scripts/ext2_test.py

      - name: Test ext2 root, data mounts, rejection, and reboot persistence
        if: matrix.suite == 'root'
        run: make test-disk-root
      - name: Build reproducible full ext2 root
        if: matrix.suite == 'root' || matrix.suite == 'root-userspace'
        run: make disk-root
      - name: Test delayed root flushes and bounded request timeout
        if: matrix.suite == 'root'
        run: |
          python3 scripts/root_io_test.py
          python3 scripts/root_io_test.py --firmware bios --transport modern --delay 35 --expect-timeout
      - name: Test full userspace from ext2 root
        if: matrix.suite == 'root-userspace'
        run: |
          python3 scripts/boot_test.py --disk-root --transport modern --firmware both --timeout 900
          python3 scripts/boot_test.py --disk-root --transport legacy --firmware both --timeout 900
      - name: Test normal desktop startup from ext2 root
        if: matrix.suite == 'root-userspace'
        run: |
          python3 scripts/boot_test.py --disk-root --interactive --transport modern --firmware both --timeout 180
          python3 scripts/boot_test.py --disk-root --interactive --transport legacy --firmware both --timeout 180
      - name: Upload ext2 root image
        if: always() && matrix.suite == 'root-userspace'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-disk-root
          path: |
            build/axiom64-disk.iso
            build/root-disk.raw
            build/disk-root-*-boot-*.raw
      - name: Verify normal init recovery with the same desktop and console
        if: startsWith(matrix.suite, 'normal-init-')
        env:
          SUITE: ${{ matrix.suite }}
          AXIOM64_QEMU_ACCELERATOR: ${{ inputs.manager_accelerator || 'tcg' }}
        run: |
          firmware=${SUITE#normal-init-}
          case "$firmware" in bios|uefi) ;; *) exit 1 ;; esac
          python3 scripts/normal_manager_peer_test.py 2>&1 | tee build/normal-init-peer.log
          python3 scripts/normal_manager_test.py --firmware "$firmware"
      - name: Upload normal init root fixtures
        if: always() && startsWith(matrix.suite, 'normal-init-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-root-${{ matrix.suite }}
          if-no-files-found: error
          compression-level: 1
          path: |
            build/normal-init-*.raw
            build/axiom64-normal-init-*.iso
      - name: Upload saved-state root fixtures
        if: always() && matrix.suite == 'random'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-manager-persistent-root
          if-no-files-found: error
          path: |
            build/manager-persistent-*.raw
            build/axiom64-manager-persistent-*.iso
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-evidence-${{ matrix.suite }}
          path: |
            build/*.log
            build/*.trace
            build/*.gdb
            build/*results.json
            build/manager-protocol-*-packets.json
            build/manager-link-*-packets.json
            build/dns-*-packets.json
            build/normal-init-*-dns-packets.json
            build/paired-network/**
            build/*.png
            build/*.dump
            build/tcp-*.pcap
            build/tcp-fault-*-peer.json
            build/tcp-reordering-*-peer.json
            build/tcp-persist-*-peer.json
            build/tcp-timeout-*-peer.json
            build/tcp-old-ack-*-peer.json
            build/tcp-challenge-*-peer.json
            build/tcp-lifetime-*-peer.json
      - name: Upload TCP boot fixtures
        if: always() && matrix.suite == 'tcp'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-tcp-fixtures
          if-no-files-found: error
          path: build/axiom64-tcp-*.iso
      - name: Upload controlled TCP wire boot fixtures
        if: always() && (startsWith(matrix.suite, 'tcp-fault-') || (startsWith(matrix.suite, 'tcp-lifetime-') && matrix.suite != 'tcp-lifetime-native'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-${{ matrix.suite }}-fixtures
          if-no-files-found: error
          path: |
            build/axiom64-tcp-fault-*.iso
            build/axiom64-tcp-reordering-*.iso
            build/axiom64-tcp-persist-*.iso
            build/axiom64-tcp-timeout-*.iso
            build/axiom64-tcp-old-ack-*.iso
            build/axiom64-tcp-challenge-*.iso
            build/axiom64-tcp-lifetime-*.iso
      - name: Upload credential filesystem and boot fixtures
        if: always() && matrix.suite == 'credentials'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-credentials-fixtures
          if-no-files-found: error
          path: |
            build/credentials-*.img
            build/axiom64-credentials-*.iso

  qemu:
    needs: [build, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the build and every test suite to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$TEST_RESULT" = success
