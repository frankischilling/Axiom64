[[step]]
suites = ["ipv4-source-filters"]
name = "Compare complete source-filter and source-route cohorts with native Linux and both guest adapters"
run = '''
python3 -B scripts/tests/ipv4_source_guard_test.py -v
sudo -n env PYTHONPATH=scripts python3 -B -m ipv4_source_route.window
'''

[[step]]
suites = ["ipv4-source-filters"]
name = "Compare finite IPv4 address controls and transport lifetime ownership"
run = '''
sudo -n make test-ipv4-address-lifetimes
'''

[[step]]
suites = ["ipv4-source-filters"]
name = "Reopen complete source-filter evidence under root and an ordinary identity"
run = '''
sudo -n env PYTHONPATH=scripts python3 -B -m ipv4_multicast.source_protected --directory build/ipv4-source-evidence --output build/ipv4-source-audit
'''
