name: Measure IPv6 device readiness
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ipv6-device-ready-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native packet tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 ethtool
      - name: Restore the original native reference product and evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ipv6-configuration
          path: ${{ runner.temp }}/device-reference
          run-id: 40249563493
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Measure eight interleaved trials without changing any protocol deadline
        run: |
          sudo -n python3 -B scripts/diagnostics/ipv6_device_ready.py --reference "${RUNNER_TEMP}/device-reference" --directory build/device-ready-diagnostic
      - name: Preserve every timing result and original packet clock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ipv6-device-ready-diagnostic
          if-no-files-found: error
          path: |
            build/device-ready-diagnostic
            scripts/diagnostics/ipv6_device_ready.py
            .github/workflows/build.yml
