name: Build and boot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build and emulation tools
        run: sudo apt-get update && sudo apt-get install -y g++ make musl-tools linux-libc-dev nasm python3 xorriso qemu-system-x86 ovmf xfonts-utils e2fsprogs
      - name: Build standalone image
        run: make -j2 image
      - name: Test BIOS and UEFI userspace
        run: python3 scripts/boot_test.py --firmware both
      - name: Test pthread lifecycle and futex synchronization
        run: make test-threads
      - name: Test virtio disks and reboot persistence
        run: python3 scripts/storage_test.py
      - name: Test writable ext2 volumes and host fsck
        run: python3 scripts/ext2_test.py
      - name: Test normal desktop startup
        run: python3 scripts/boot_test.py --interactive --firmware both --timeout 180
      - name: Bundle corresponding sources
        run: make sources
      - name: Upload sources and recipes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-sources
          compression-level: 0
          path: build/axiom64-sources.tar
      - name: Upload boot image and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom64-boot
          path: |
            build/axiom64.iso
            build/axiom64.elf
            build/boot-*.log
            build/boot-results.json
            build/threads-*.log
            build/threads-*-results.json
            build/desktop-*.png
            build/interactive-*.log
            build/interactive-*.png
            build/interactive-results.json
            build/storage-*.log
            build/storage-*.trace
            build/storage-results.json
            build/ext2-*.log
            build/ext2-results.json
            build/busybox-build.log
