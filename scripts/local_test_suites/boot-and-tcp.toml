[[step]]
suites = ["boot"]
name = "Compare Unix ancillary ownership and reopen actual guest products"
run = '''
make test-unix-rights-policy test-unix-datagram-policy
sudo -n python3 -B scripts/unix_stream_native.py
sudo -n python3 -B scripts/unix_stream_native.py --client unix_shutdown
sudo -n python3 -B scripts/unix_stream_native.py --client unix_stream_wait
sudo -n python3 -B scripts/unix_stream_native.py --client unix_stream_names
umask 022
evidence_parent=$(mktemp -d /var/tmp/axiom64-unix-evidence.XXXXXXXX)
chmod 0755 "$evidence_parent"
archive_unix_evidence() {
  tar -C "$evidence_parent" -czf build/unix-datagram-guest.tar.gz .
  case "$evidence_parent" in
    /var/tmp/axiom64-unix-evidence.*) rm -r -- "$evidence_parent" ;;
    *) return 1 ;;
  esac
}
trap archive_unix_evidence EXIT
evidence="$evidence_parent/guest"
python3 -B scripts/unix_datagram_test.py --directory "$evidence"
python3 -B "$evidence/inputs/scripts/unix_datagram_proof.py" "$evidence"
sudo -n -u nobody python3 -B "$evidence/inputs/scripts/unix_datagram_proof.py" "$evidence"
'''

